spring.datasource.url=jdbc:mysql://reserve-mysql:3306/reserve_project?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jwt.secret=${JWT_SECRET}
spring.mail.username=loadtest@example.com
spring.mail.password=noop

spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.enabled=false
management.endpoints.web.exposure.include=health,metrics

# 부하 테스트 중 이메일 발송 차단 — 워커 빈을 만들지 않는다. 아웃박스 적재(INSERT)는 운영과 같은 쓰기 비용을 재기 위해 유지
email.outbox.scheduler.enabled=false

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:200}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:100}
